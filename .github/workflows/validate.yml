name: DAHLEEZ Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -s index.html
          test -s assets/css/style.css
          test -s assets/js/app.js
          test -s assets/brand/mark.svg
          test -s backend/src/worker.js
          test -s backend/schema.sql
          grep -q 'lang="ar" dir="rtl"' index.html
          grep -q 'status.*pending' backend/src/worker.js
          echo "DAHLEEZ required files are present."
