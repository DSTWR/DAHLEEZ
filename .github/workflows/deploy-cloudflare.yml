name: DAHLEEZ Deploy to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Verify deployment files
        working-directory: backend
        run: |
          test -f src/worker.js
          test -f wrangler.toml
          test -f schema.sql
          test -f ../index.html
          test -f ../admin.html
          test -d ../assets
          echo "Deployment source files verified."

      - name: Install pinned Wrangler
        run: npm install --global wrangler@4

      - name: Validate Worker bundle
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler --version
          wrangler deploy --dry-run

      - name: Deploy Worker and static website with diagnostic output
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          wrangler deploy 2>&1 | tee ../wrangler-deploy.log
