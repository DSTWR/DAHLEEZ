name: DAHLEEZ Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "public/**"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Verify deployment files
        working-directory: backend
        run: |
          test -f src/worker.js
          test -f wrangler.toml
          test -f schema.sql
          test -f ../public/index.html
          test -f ../public/admin.html
          test -f ../public/assets/js/app.js
          test -f ../public/assets/js/admin.js
          echo "Deployment source files verified."

      - name: Install current Wrangler v4
        run: npm install --global wrangler@4

      - name: Validate Worker bundle
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler --version
          wrangler deploy --dry-run

      - name: Deploy Worker and static website
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
