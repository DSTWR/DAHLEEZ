name = "dahlez-newsroom"
main = "src/worker.js"
compatibility_date = "2026-11-27"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "dahlez-newsroom"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
# Configure SOURCES_JSON only after reviewing each publisher's official RSS terms.
SOURCES_JSON = "[]"

[assets]
directory = "./public"
run_worker_first = ["/api/*"]
