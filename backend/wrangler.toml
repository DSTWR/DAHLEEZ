name = "dahleez-newsroom"
main = "src/worker.js"
compatibility_date = "2026-11-26"
workers_dev = true
preview_urls = false

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "dahleez-newsroom"
database_id = "b7fdb505-ea84-494f-864d-d99d78f34687"

[vars]
# Existing enabled editorial sources. All fetched items remain pending until human approval.
SOURCES_JSON = '[{"id":"aljazeera-arabic","name":"Al Jazeera Arabic","feed_url":"https://www.aljazeera.net/aljazeerarss/a7c186be-1baa-4bd4-9d80-a84db769f779/73d0e1b4-532f-45ef-b135-bfdff8b8cab9","category":"world","enabled":true},{"id":"bbc-arabic","name":"BBC News Arabic","feed_url":"https://feeds.bbci.co.uk/arabic/rss.xml","category":"world","enabled":true},{"id":"dw-arabic","name":"Deutsche Welle Arabic","feed_url":"https://rss.dw.com/rdf/rss-ar-all","category":"world","enabled":true}]'

[assets]
directory = "../public"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
