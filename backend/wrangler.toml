name = "dahleez-newsroom"
main = "src/worker.js"
compatibility_date = "2026-11-27"
workers_dev = true
preview_urls = false

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "dahleez-newsroom"
database_id = "b7fdb505-ea84-494f-864d-d99d78f34687"

[vars]
# Feeds stay disabled until their reuse terms are reviewed and approved.
SOURCES_JSON = "[]"

[assets]
directory = "../public"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
